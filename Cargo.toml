[workspace]
resolver = "2"
members = ["crates/alibi-core", "crates/alibi-service", "crates/alibi-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
zcash_primitives = { version = "=0.31.0-pre.2", default-features = false, features = ["std"] }
zcash_protocol = { version = "=0.11.0-pre.1", default-features = false, features = ["std"] }
orchard = { version = "0.16", default-features = false, features = ["std"] }
sapling = { package = "sapling-crypto", version = "0.9", default-features = false, features = ["std"] }
incrementalmerkletree = { version = "0.9", default-features = false, features = ["legacy-api"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = 3
codegen-units = 4

